<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Bags | Luxury Fashion Collection</title>

<meta name="description"
content="Elite Bags - Luxury fashion collection with worldwide delivery, secure PayPal payments and WhatsApp customer support.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050607;
    color:#fff;
    font-family:'Montserrat',sans-serif;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:92%;
    max-width:1350px;
    margin:auto;
}


/* =====================================================
   TOP SHIPPING BAR
===================================================== */

.top-bar{
    background:#e9002d;
    color:#fff;
    text-align:center;
    padding:8px 12px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.4px;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{
    position:sticky;
    top:0;
    z-index:9999;

    background:rgba(5,7,8,.96);
    backdrop-filter:blur(12px);

    border-bottom:1px solid #292d31;
}

.nav-inner{
    min-height:74px;

    display:flex;
    align-items:center;
    gap:25px;
}


/* =====================================================
   INLINE LOGO - NO IMAGE NEEDED
===================================================== */

.logo{
    width:60px;
    height:60px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-svg{
    width:58px;
    height:58px;
}

.logo-text{
    margin-left:-5px;
}

.logo-text strong{
    display:block;

    font-family:'Cinzel',serif;
    font-size:17px;
    letter-spacing:2px;
}

.logo-text span{
    display:block;

    color:#aaa;
    font-size:7px;
    letter-spacing:2px;
    margin-top:2px;
}


.nav-links{
    display:flex;
    align-items:center;
    gap:25px;
    margin-left:auto;
}

.nav-links a{
    color:#ddd;
    font-size:12px;
    font-weight:600;
    padding:28px 0;
    transition:.25s;
}

.nav-links a:hover{
    color:#ff1738;
}


.nav-search{
    width:180px;
    height:36px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:0 12px;

    border:1px solid #30353a;
    background:#111519;
    border-radius:25px;
}

.nav-search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:11px;
}

.nav-search input::placeholder{
    color:#888;
}


.whatsapp-top{
    display:flex;
    align-items:center;
    gap:7px;

    white-space:nowrap;

    color:#fff;
    font-size:11px;
    font-weight:700;
}

.whatsapp-icon{
    width:30px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#20d466;
    border-radius:50%;

    font-size:16px;
}

.mobile-menu{
    display:none;
    margin-left:auto;
    font-size:27px;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:560px;

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(230,0,25,.35),
            transparent 40%
        ),
        linear-gradient(
            110deg,
            #030303,
            #300006,
            #090203
        );
}

.hero:before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            120deg,
            transparent 25%,
            rgba(255,0,30,.12),
            transparent 48%
        );

    transform:skewX(-8deg);
}

.hero-glow{
    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(255,0,25,.13);

    filter:blur(90px);
}


.hero-content{
    width:95%;
    max-width:1100px;

    position:relative;
    z-index:3;

    text-align:center;
}


/* HERO LOGO */

.hero-logo{
    width:190px;
    height:190px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border:2px solid #ff193d;
    border-radius:50%;

    box-shadow:
        0 0 20px rgba(255,0,30,.8),
        inset 0 0 30px rgba(255,0,30,.2);
}

.hero-logo-inner{
    width:160px;
    height:160px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.4);
    border-radius:50%;
}

.hero-logo-inner strong{
    font-family:'Cinzel',serif;

    font-size:32px;
    line-height:30px;
    letter-spacing:1px;

    text-shadow:
        0 0 8px #fff,
        0 0 15px #ff1738;
}

.hero-logo-inner span{
    margin-top:9px;

    font-size:7px;
    letter-spacing:3px;
    color:#ddd;
}


/* HERO TEXT */

.hero-title{
    margin-top:28px;

    font-family:'Cinzel',serif;

    font-size:30px;
    font-weight:700;

    letter-spacing:8px;

    text-shadow:0 0 18px rgba(255,255,255,.15);
}

.hero-subtitle{
    margin-top:10px;

    color:#ddd;

    font-size:14px;
    letter-spacing:3px;
}


.hero-categories{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:14px;

    margin-top:25px;
}

.hero-categories span{
    padding:8px 13px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:20px;

    background:rgba(255,255,255,.04);

    font-size:11px;
}


.hero-buttons{
    display:flex;
    justify-content:center;
    gap:12px;

    margin-top:28px;
}

.hero-button{
    border:0;
    border-radius:30px;

    padding:14px 35px;

    background:linear-gradient(
        90deg,
        #ff1738,
        #d8002b
    );

    color:#fff;

    font-size:13px;
    font-weight:800;

    box-shadow:0 8px 25px rgba(255,0,35,.3);

    transition:.25s;
}

.hero-button:hover{
    transform:translateY(-3px);
}

.hero-button.secondary{
    background:transparent;
    border:1px solid #666;
    box-shadow:none;
}


/* =====================================================
   TRUST BAR
===================================================== */

.trust{
    background:#090c0e;
    border-top:1px solid #292d31;
    border-bottom:1px solid #292d31;
}

.trust-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.trust-item{
    min-height:95px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    border-right:1px solid #292d31;
}

.trust-item:last-child{
    border-right:0;
}

.trust-icon{
    font-size:27px;
}

.trust-item strong{
    display:block;
    font-size:12px;
}

.trust-item small{
    display:block;
    margin-top:4px;
    color:#999;
    font-size:9px;
}


/* =====================================================
   IMPORTANT DELIVERY NOTICE
===================================================== */

.delivery-notice{
    margin:25px auto 0;

    width:92%;
    max-width:1000px;

    padding:16px 20px;

    border:1px solid #493238;
    border-left:4px solid #ff1738;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            rgba(255,0,35,.10),
            rgba(255,255,255,.02)
        );
}

.delivery-notice strong{
    display:block;

    font-size:13px;
}

.delivery-notice p{
    margin-top:5px;

    color:#bbb;

    font-size:10px;
    line-height:1.6;
}


/* =====================================================
   SHOP AREA
===================================================== */

.shop{
    padding:35px 0 60px;
}

.shop-tools{
    margin-bottom:25px;
}

.big-search{
    max-width:650px;
    height:46px;

    margin:auto;

    display:flex;
    align-items:center;
    gap:10px;

    padding:0 17px;

    background:#111519;

    border:1px solid #34393e;

    border-radius:30px;
}

.big-search input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:12px;
}

.big-search input::placeholder{
    color:#888;
}


.filters{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:9px;

    margin-top:15px;
}

.filter-btn{
    padding:9px 18px;

    border:1px solid #30353a;
    border-radius:25px;

    background:#0c1013;
    color:#fff;

    font-size:10px;
    font-weight:700;

    transition:.25s;
}

.filter-btn:hover,
.filter-btn.active{
    background:#ff1738;
    border-color:#ff1738;

    box-shadow:0 4px 15px rgba(255,0,35,.2);
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-heading{
    display:flex;
    align-items:end;
    justify-content:space-between;

    margin:25px 0 16px;
}

.section-heading h2{
    font-family:'Cinzel',serif;
    font-size:21px;
}

.section-heading p{
    margin-top:5px;
    color:#888;
    font-size:10px;
}

.section-heading a{
    color:#ff1738;
    font-size:10px;
    font-weight:700;
}


/* =====================================================
   PRODUCTS
===================================================== */

.products{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:16px;
}


.product-card{
    overflow:hidden;

    background:#0c1013;

    border:1px solid #292e33;

    border-radius:10px;

    transition:.3s;
}

.product-card:hover{
    transform:translateY(-5px);

    border-color:#ff1738;

    box-shadow:0 10px 30px rgba(255,0,30,.13);
}


/* PRODUCT IMAGE SLIDER */

.product-gallery{
    height:300px;

    position:relative;

    overflow:hidden;

    background:#111;
}

.gallery-image{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:0;

    transform:scale(1.04);

    transition:
        opacity .4s ease,
        transform .4s ease;
}

.gallery-image.active{
    opacity:1;
    transform:scale(1);
}


.trending{
    position:absolute;
    top:10px;
    left:10px;

    z-index:20;

    padding:5px 9px;

    background:#ff1738;

    border-radius:15px;

    font-size:8px;
    font-weight:800;
}


.gallery-arrow{
    position:absolute;

    top:50%;
    transform:translateY(-50%);

    z-index:30;

    width:31px;
    height:31px;

    border:1px solid rgba(255,255,255,.4);

    border-radius:50%;

    background:rgba(0,0,0,.65);

    color:#fff;

    font-size:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.gallery-arrow:hover{
    background:#ff1738;
}

.gallery-arrow.left{
    left:9px;
}

.gallery-arrow.right{
    right:9px;
}


.image-dots{
    position:absolute;

    left:0;
    right:0;
    bottom:10px;

    z-index:40;

    display:flex;
    justify-content:center;

    gap:5px;
}

.dot{
    width:6px;
    height:6px;

    border-radius:10px;

    background:#ddd;

    cursor:pointer;
}

.dot.active{
    width:17px;
    background:#ff1738;
}


/* PRODUCT INFO */

.product-info{
    padding:14px;
}

.product-name{
    font-size:12px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-description{
    margin-top:5px;

    color:#888;

    font-size:9px;

    line-height:1.5;
}

.product-meta{
    margin-top:8px;

    display:flex;
    justify-content:space-between;

    color:#aaa;

    font-size:8px;
}

.quality{
    display:inline-block;

    margin-top:9px;

    padding:5px 8px;

    color:#fff;

    background:#64152a;

    border-radius:12px;

    font-size:8px;
    font-weight:700;
}

.price{
    margin-top:10px;

    font-size:19px;
    font-weight:800;
}

.order-btn{
    width:100%;

    margin-top:11px;

    padding:10px;

    border:0;
    border-radius:22px;

    background:#20d466;

    color:#fff;

    font-size:10px;
    font-weight:800;

    transition:.25s;
}

.order-btn:hover{
    background:#17b956;
    transform:translateY(-2px);
}


/* =====================================================
   CATEGORY SECTIONS
===================================================== */

.category-grid{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:12px;

    margin-top:25px;
}

.category-card{
    min-height:125px;

    position:relative;

    overflow:hidden;

    display:flex;
    align-items:flex-end;

    border:1px solid #30353a;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #270006,
            #111
        );

    transition:.3s;
}

.category-card:hover{
    border-color:#ff1738;
    transform:translateY(-3px);
}

.category-card-content{
    width:100%;

    padding:17px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );
}

.category-card h3{
    font-family:'Cinzel',serif;
    font-size:13px;
}

.category-card p{
    margin-top:5px;

    color:#aaa;

    font-size:8px;
}


/* =====================================================
   PAYMENT / TRUST SECTION
===================================================== */

.trust-section{
    margin-top:45px;

    padding:35px;

    border:1px solid #2c3136;

    border-radius:13px;

    background:
        radial-gradient(
            circle at top right,
            rgba(255,0,30,.10),
            transparent 40%
        ),
        #0a0d0f;
}

.trust-heading{
    text-align:center;
}

.trust-heading h2{
    font-family:'Cinzel',serif;
    font-size:22px;
}

.trust-heading p{
    margin-top:7px;
    color:#999;
    font-size:10px;
}

.trust-boxes{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:12px;

    margin-top:25px;
}

.trust-box{
    padding:18px;

    text-align:center;

    background:#111519;

    border:1px solid #282e33;

    border-radius:9px;
}

.trust-box .icon{
    font-size:25px;
}

.trust-box strong{
    display:block;
    margin-top:9px;
    font-size:11px;
}

.trust-box p{
    margin-top:5px;
    color:#888;
    font-size:8px;
    line-height:1.5;
}


/* =====================================================
   WHATSAPP CTA
===================================================== */

.whatsapp-section{
    margin-top:30px;

    padding:25px;

    text-align:center;

    border-radius:12px;

    background:
        linear-gradient(
            100deg,
            #07160d,
            #0b2013
        );

    border:1px solid #174b2c;
}

.whatsapp-section h2{
    font-family:'Cinzel',serif;
    font-size:20px;
}

.whatsapp-section p{
    margin-top:7px;

    color:#aaa;

    font-size:10px;
}

.whatsapp-button{
    display:inline-flex;
    align-items:center;
    gap:8px;

    margin-top:16px;

    padding:12px 25px;

    background:#20d466;

    border-radius:25px;

    font-size:11px;
    font-weight:800;
}

.whatsapp-button:hover{
    background:#18b957;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    margin-top:50px;

    background:#07090a;

    border-top:1px solid #292d31;
}

.footer-main{
    display:grid;

    grid-template-columns:1.4fr 1fr 1fr 1.2fr;

    gap:35px;

    padding:40px 0;
}

.footer-brand{
    display:flex;
    gap:12px;
}

.footer-brand h2{
    font-family:'Cinzel',serif;
    font-size:18px;
}

.footer-brand p{
    margin-top:7px;
    color:#888;
    font-size:9px;
    line-height:1.7;
}

footer h3{
    margin-bottom:13px;
    font-size:12px;
}

.footer-links{
    display:grid;
    gap:9px;

    color:#999;

    font-size:9px;
}

.footer-links a:hover{
    color:#ff1738;
}

.footer-contact{
    display:grid;
    gap:9px;

    color:#aaa;

    font-size:9px;
}

.footer-contact a:hover{
    color:#ff1738;
}

.copyright{
    padding:14px 0;

    border-top:1px solid #292d31;

    display:flex;
    justify-content:space-between;

    color:#666;

    font-size:8px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .nav-links{
        gap:13px;
    }

    .nav-links a{
        font-size:10px;
    }

    .nav-search{
        display:none;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .category-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .trust-boxes{
        grid-template-columns:repeat(2,1fr);
    }
}


@media(max-width:700px){

    .top-bar{
        font-size:9px;
    }

    .navbar{
        position:sticky;
    }

    .nav-inner{
        min-height:62px;
    }

    .logo{
        width:50px;
        height:50px;
    }

    .logo-svg{
        width:48px;
        height:48px;
    }

    .logo-text{
        display:none;
    }

    .nav-links{
        display:none;

        position:absolute;

        top:62px;
        left:0;
        right:0;

        flex-direction:column;

        gap:0;

        padding:10px 0;

        background:#080a0c;

        border-bottom:1px solid #333;
    }

    .nav-links.show{
        display:flex;
    }

    .nav-links a{
        width:100%;
        text-align:center;
        padding:11px;
    }

    .whatsapp-top span:last-child{
        display:none;
    }

    .mobile-menu{
        display:block;
    }


    /* HERO */

    .hero{
        min-height:510px;
    }

    .hero-logo{
        width:155px;
        height:155px;
    }

    .hero-logo-inner{
        width:130px;
        height:130px;
    }

    .hero-logo-inner strong{
        font-size:26px;
        line-height:25px;
    }

    .hero-title{
        font-size:18px;
        letter-spacing:4px;
        margin-top:22px;
    }

    .hero-subtitle{
        font-size:9px;
        letter-spacing:2px;
    }

    .hero-categories{
        gap:7px;
    }

    .hero-categories span{
        font-size:8px;
        padding:7px 9px;
    }

    .hero-buttons{
        margin-top:22px;
    }

    .hero-button{
        padding:12px 23px;
        font-size:11px;
    }


    /* TRUST */

    .trust-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .trust-item{
        min-height:80px;
        padding:10px;
    }

    .trust-icon{
        font-size:21px;
    }

    .trust-item strong{
        font-size:9px;
    }

    .trust-item small{
        font-size:7px;
    }


    /* PRODUCTS */

    .shop{
        padding-top:25px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .product-gallery{
        height:190px;
    }

    .product-info{
        padding:9px;
    }

    .product-name{
        font-size:10px;
    }

    .price{
        font-size:15px;
    }

    .order-btn{
        padding:9px 3px;
        font-size:8px;
    }


    /* CATEGORIES */

    .category-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .category-card{
        min-height:100px;
    }


    /* TRUST SECTION */

    .trust-section{
        padding:22px 12px;
    }

    .trust-boxes{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .trust-box{
        padding:13px 7px;
    }


    /* FOOTER */

    .footer-main{
        grid-template-columns:1fr 1fr;
        gap:25px;
    }

    .copyright{
        flex-direction:column;
        gap:6px;
    }
}


@media(max-width:430px){

    .hero-title{
        font-size:16px;
    }

    .hero-subtitle{
        font-size:8px;
    }

    .product-gallery{
        height:170px;
    }

    .footer-main{
        grid-template-columns:1fr;
    }

    .delivery-notice{
        padding:13px;
    }
}
</style>
</head>


<body>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="top-bar">
🚚 FRE
