<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Bags | Luxury Fashion Collection</title>

<meta name="description"
content="Elite Bags — discover our curated luxury fashion collection of bags, shoes, watches, jewelry and clothing.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050607;
    color:#fff;
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

img{
    max-width:100%;
    display:block;
}

.container{
    width:92%;
    max-width:1400px;
    margin:auto;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#08090a;
}

::-webkit-scrollbar-thumb{
    background:#e91535;
    border-radius:10px;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{
    position:sticky;
    top:0;
    z-index:9999;

    height:72px;

    background:rgba(5,7,8,.94);
    backdrop-filter:blur(16px);

    border-bottom:1px solid rgba(255,255,255,.1);
}

.nav-inner{
    width:92%;
    max-width:1400px;
    height:100%;
    margin:auto;

    display:flex;
    align-items:center;
    gap:25px;
}


/* LOGO */

.logo{
    width:62px;
    height:62px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}


/* NAV LINKS */

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;

    margin-left:auto;
}

.nav-links a{
    position:relative;

    padding:26px 0;

    color:#ddd;

    font-size:12px;
    font-weight:600;

    transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
    color:#ff1738;
}

.nav-links a.active::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:3px;

    background:#ff1738;

    box-shadow:0 0 12px #ff1738;
}


/* NAV SEARCH */

.nav-search{
    width:180px;
    height:38px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:0 13px;

    background:#111417;

    border:1px solid #30353a;
    border-radius:30px;
}

.nav-search input{
    width:100%;

    background:transparent;

    border:0;
    outline:0;

    color:#fff;

    font-size:11px;
}

.nav-search input::placeholder{
    color:#888;
}


/* WHATSAPP */

.whatsapp-top{
    display:flex;
    align-items:center;
    gap:8px;

    white-space:nowrap;

    color:#eee;

    font-size:11px;
    font-weight:600;
}

.whatsapp-icon{
    width:32px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#20d463;

    border-radius:50%;

    font-size:17px;

    box-shadow:0 0 15px rgba(32,212,99,.3);
}


/* MOBILE MENU */

.mobile-menu{
    display:none;

    margin-left:5px;

    font-size:27px;

    color:#fff;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    min-height:560px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#080001;
}


/* YOUR BANNER */

.hero-banner{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center;

    z-index:1;
}


/* DARK OVERLAY */

.hero::after{
    content:"";

    position:absolute;

    inset:0;

    z-index:2;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.45),
            rgba(0,0,0,.05),
            rgba(0,0,0,.45)
        );

    pointer-events:none;
}


/* HERO CONTENT */

.hero-content{
    position:relative;

    z-index:3;

    width:92%;
    max-width:900px;

    text-align:center;

    margin-top:210px;
}


/*
   Banner already contains ELITE BAGS,
   so we keep the text below it clean.
*/

.hero-title{
    font-family:'Cinzel',serif;

    font-size:27px;

    letter-spacing:6px;

    text-shadow:
        0 2px 15px rgba(0,0,0,.9);

    margin-bottom:9px;
}

.hero-subtitle{
    color:#eee;

    font-size:13px;

    letter-spacing:3px;

    margin-bottom:25px;
}

.hero-button{
    border:0;

    padding:14px 38px;

    border-radius:30px;

    background:linear-gradient(
        135deg,
        #ff1738,
        #c60022
    );

    color:#fff;

    font-size:13px;
    font-weight:700;

    box-shadow:
        0 8px 30px rgba(255,0,40,.4);

    transition:.3s;
}

.hero-button:hover{
    transform:translateY(-3px) scale(1.03);

    box-shadow:
        0 12px 40px rgba(255,0,40,.6);
}


/* =========================================================
   TRUST FEATURES
========================================================= */

.features{
    background:#090c0e;

    border-top:1px solid #292d31;
    border-bottom:1px solid #292d31;
}

.features-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);
}

.feature{
    min-height:95px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:13px;

    padding:15px;

    border-right:1px solid #292d31;
}

.feature:last-child{
    border-right:0;
}

.feature-icon{
    font-size:28px;
}

.feature strong{
    display:block;

    font-size:12px;
}

.feature small{
    display:block;

    margin-top:5px;

    color:#999;

    font-size:9px;
}


/* =========================================================
   SHOP AREA
========================================================= */

.shop{
    padding:38px 0 55px;
}


/* SEARCH */

.big-search{
    width:100%;
    max-width:700px;

    height:50px;

    margin:auto;

    display:flex;
    align-items:center;
    gap:12px;

    padding:0 18px;

    background:#111417;

    border:1px solid #34393e;

    border-radius:30px;

    transition:.3s;
}

.big-search:focus-within{
    border-color:#ff1738;

    box-shadow:
        0 0 20px rgba(255,0,40,.15);
}

.big-search span{
    font-size:18px;
}

.big-search input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:13px;
}

.big-search input::placeholder{
    color:#888;
}


/* FILTERS */

.filters{
    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:9px;

    margin:20px 0 30px;
}

.filter-btn{
    padding:10px 20px;

    border:1px solid #30353a;

    border-radius:30px;

    background:#0d1012;

    color:#ddd;

    font-size:11px;
    font-weight:600;

    transition:.25s;
}

.filter-btn:hover,
.filter-btn.active{
    background:#ff1738;

    border-color:#ff1738;

    color:#fff;

    box-shadow:
        0 5px 20px rgba(255,0,40,.25);
}


/* SECTION HEADER */

.section-heading{
    display:flex;

    align-items:end;

    justify-content:space-between;

    margin-bottom:18px;
}

.section-heading h2{
    font-family:'Cinzel',serif;

    font-size:23px;
}

.section-heading p{
    color:#888;

    font-size:10px;

    margin-top:5px;
}

.view-all{
    color:#ff1738;

    font-size:11px;
    font-weight:700;
}


/* =========================================================
   PRODUCTS
========================================================= */

.products{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:16px;
}


/* PRODUCT CARD */

.product-card{
    overflow:hidden;

    background:#0d1012;

    border:1px solid #292e32;

    border-radius:12px;

    transition:.3s;
}

.product-card:hover{
    transform:translateY(-6px);

    border-color:#ff1738;

    box-shadow:
        0 12px 35px rgba(255,0,40,.15);
}


/* GALLERY */

.product-gallery{
    position:relative;

    height:300px;

    overflow:hidden;

    background:#111;
}

.gallery-images{
    position:relative;

    width:100%;
    height:100%;
}

.gallery-image{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:0;

    transform:scale(1.03);

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.gallery-image.active{
    opacity:1;

    transform:scale(1);
}


/* BADGE */

.product-badge{
    position:absolute;

    top:12px;
    left:12px;

    z-index:10;

    padding:6px 10px;

    border-radius:20px;

    background:#ff1738;

    color:#fff;

    font-size:9px;
    font-weight:700;

    box-shadow:0 5px 15px rgba(0,0,0,.3);
}


/* ARROWS */

.gallery-arrow{
    position:absolute;

    top:50%;

    transform:translateY(-50%);

    z-index:20;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.4);

    background:rgba(0,0,0,.65);

    color:#fff;

    font-size:22px;

    opacity:0;

    transition:.25s;
}

.product-gallery:hover .gallery-arrow{
    opacity:1;
}

.gallery-arrow:hover{
    background:#ff1738;

    border-color:#ff1738;
}

.gallery-arrow.left{
    left:10px;
}

.gallery-arrow.right{
    right:10px;
}


/* DOTS */

.image-dots{
    position:absolute;

    bottom:10px;

    left:0;
    right:0;

    z-index:30;

    display:flex;

    justify-content:center;

    gap:5px;
}

.dot{
    width:6px;
    height:6px;

    border-radius:10px;

    background:rgba(255,255,255,.6);

    cursor:pointer;

    transition:.2s;
}

.dot.active{
    width:18px;

    background:#ff1738;
}


/* PRODUCT INFO */

.product-info{
    padding:15px;
}

.product-category{
    color:#888;

    font-size:8px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.product-name{
    margin-top:6px;

    font-size:13px;

    font-weight:600;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.product-meta{
    margin-top:6px;

    color:#999;

    font-size:9px;
}

.quality{
    display:inline-block;

    margin-top:10px;

    padding:5px 9px;

    background:#351017;

    border:1px solid #6d1728;

    border-radius:15px;

    color:#ff9aaa;

    font-size:8px;

    font-weight:600;
}

.product-bottom{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-top:12px;
}

.price{
    font-size:18px;

    font-weight:700;
}

.order-btn{
    border:0;

    padding:9px 13px;

    border-radius:20px;

    background:#ff1738;

    color:#fff;

    font-size:9px;

    font-weight:700;

    transition:.25s;
}

.order-btn:hover{
    background:#d60027;

    transform:translateY(-2px);
}


/* NO RESULTS */

.no-results{
    display:none;

    text-align:center;

    padding:50px 20px;

    color:#888;

    font-size:13px;
}


/* =========================================================
   CATEGORY SECTION
========================================================= */

.categories-section{
    padding:20px 0 60px;
}

.category-grid{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:14px;
}

.category-card{
    position:relative;

    height:150px;

    overflow:hidden;

    border:1px solid #30353a;

    border-radius:10px;

    background:#111;

    cursor:pointer;
}

.category-card img{
    width:100%;
    height:100%;

    object-fit:cover;

    opacity:.58;

    transition:.4s;
}

.category-card:hover img{
    transform:scale(1.08);

    opacity:.8;
}

.category-overlay{
    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    padding:20px;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.88),
            rgba(0,0,0,.15)
        );
}

.category-overlay h3{
    font-family:'Cinzel',serif;

    font-size:15px;
}

.category-overlay p{
    margin-top:6px;

    color:#ccc;

    font-size:9px;
}


/* =========================================================
   NEWSLETTER
========================================================= */

.newsletter{
    margin:0 0 50px;

    padding:45px 20px;

    text-align:center;

    border:1px solid #292d31;

    border-radius:15px;

    background:
        radial-gradient(
            circle at center,
            rgba(150,0,20,.2),
            transparent 60%
        ),
        #0b0e10;
}

.newsletter h2{
    font-family:'Cinzel',serif;

    font-size:23px;
}

.newsletter p{
    margin-top:8px;

    color:#999;

    font-size:11px;
}

.newsletter-form{
    width:100%;
    max-width:500px;

    margin:22px auto 0;

    display:flex;

    gap:8px;
}

.newsletter-form input{
    flex:1;

    min-width:0;

    height:43px;

    padding:0 15px;

    background:#111417;

    border:1px solid #33383d;

    border-radius:25px;

    outline:0;

    color:#fff;

    font-size:11px;
}

.newsletter-form button{
    height:43px;

    padding:0 20px;

    border:0;

    border-radius:25px;

    background:#ff1738;

    color:#fff;

    font-size:10px;

    font-weight:700;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    background:#080a0c;

    border-top:1px solid #292d31;
}

.footer-main{
    display:grid;

    grid-template-columns:1.4fr 1fr 1fr 1.2fr;

    gap:40px;

    padding:45px 0;
}


/* FOOTER BRAND */

.footer-brand{
    display:flex;

    gap:15px;
}

.footer-logo{
    width:70px;
    height:70px;

    flex-shrink:0;

    overflow:hidden;
}

.footer-logo img{
    width:100%;
    height:100%;

    object-fit:contain;
}

.footer-brand h2{
    font-family:'Cinzel',serif;

    font-size:17px;
}

.footer-brand p{
    max-width:260px;

    margin-top:7px;

    color:#888;

    font-size:10px;

    line-height:1.7;
}


/* FOOTER HEADINGS */

footer h3{
    margin-bottom:14px;

    font-size:12px;
}


/* FOOTER LINKS */

.footer-links{
    display:grid;

    gap:9px;

    color:#aaa;

    font-size:10px;
}

.footer-links a{
    transition:.2s;
}

.footer-links a:hover{
    color:#ff1738;
}


/* CONTACT */

.footer-contact{
    display:grid;

    gap:10px;

    color:#aaa;

    font-size:10px;
}

.footer-contact a:hover{
    color:#ff1738;
}


/* SOCIAL */

.footer-social{
    display:flex;

    gap:8px;

    margin-top:15px;
}

.social{
    width:32px;
    height:32px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#181c1f;

    transition:.25s;
}

.social:hover{
    background:#ff1738;

    transform:translateY(-3px);
}


/* COPYRIGHT */

.copyright{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:20px;

    padding:15px 0;

    border-top:1px solid #292d31;

    color:#666;

    font-size:9px;
}


/* =========================================================
   MOBILE NAV
========================================================= */

@media(max-width:1000px){

    .nav-links{
        gap:17px;
    }

    .nav-links a{
        font-size:10px;
    }

    .nav-search{
        width:145px;
    }

    .products{
        grid-template-columns:repeat(3,1fr);
    }

    .category-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .footer-main{
        grid-template-columns:repeat(2,1fr);
    }
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:760px){

    .navbar{
        height:64px;
    }

    .nav-inner{
        width:94%;
    }

    .logo{
        width:54px;
        height:54px;
    }

    .nav-links{
        display:none;

        position:absolute;

        top:64px;
        left:0;

        width:100%;

        flex-direction:column;

        gap:0;

        margin:0;

        padding:8px 0;

        background:#080a0c;

        border-bottom:1px solid #333;
    }

    .nav-links.show{
        display:flex;
    }

    .nav-links a{
        width:100%;

        text-align:center;

        padding:12px;
    }

    .nav-links a.active::after{
        display:none;
    }

    .nav-search{
        display:none;
    }

    .whatsapp-top{
        margin-left:auto;
    }

    .whatsapp-top span:last-child{
        display:none;
    }

    .mobile-menu{
        display:block;
    }


    /* HERO */

    .hero{
        min-height:500px;
    }

    .hero-banner{
        object-position:center;
    }

    .hero-content{
        margin-top:220px;
    }

    .hero-title{
        font-size:19px;

        letter-spacing:3px;
    }

    .hero-subtitle{
        font-size:10px;

        letter-spacing:2px;
    }


    /* FEATURES */

    .features-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .feature{
        min-height:85px;

        border-bottom:1px solid #292d31;
    }


    /* PRODUCTS */

    .products{
        grid-template-columns:repeat(2,1fr);

        gap:10px;
    }

    .product-gallery{
        height:220px;
    }


    /* CATEGORIES */

    .category-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .category-card{
        height:125px;
    }


    /* FOOTER */

    .footer-main{
        grid-template-columns:1fr 1fr;

        gap:25px;
    }

    .copyright{
        flex-direction:column;

        text-align:center;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:480px){

    .container{
        width:94%;
    }

    .hero{
        min-height:430px;
    }

    .hero-banner{
        object-position:center;
    }

    .hero-content{
        margin-top:190px;
    }

    .hero-title{
        font-size:15px;

        letter-spacing:2px;
    }

    .hero-subtitle{
        font-size:9px;
    }

    .hero-button{
        padding:12px 28px;

        font-size:11px;
    }


    .feature{
        padding:10px 5px;

        gap:7px;
    }

    .feature-icon{
        font-size:22px;
    }

    .feature strong{
        font-size:9px;
    }

    .feature small{
        font-size:7px;
    }


    .shop{
        padding-top:25px;
    }

    .filters{
        gap:6px;
    }

    .filter-btn{
        min-width:75px;

        padding:8px 11px;

        font-size:9px;
    }

    .section-heading h2{
        font-size:17px;
    }

    .section-heading p{
        font-size:8px;
    }


    .products{
        grid-template-columns:repeat(2,1fr);

        gap:7px;
    }

    .product-gallery{
        height:170px;
    }

    .product-info{
        padding:9px;
    }

    .product-name{
        font-size:10px;
    }

    .product-meta{
        font-size:7px;
    }

    .quality{
        font-size:7px;

        padding:4px 6px;
    }

    .price{
        font-size:14px;
    }

    .order-btn{
        padding:7px 8px;

        font-size:8px;
    }

    .gallery-arrow{
        width:27px;
        height:27px;

        font-size:18px;

        opacity:1;
    }


    .category-grid{
        gap:7px;
    }

    .category-card{
        height:105px;
    }

    .category-overlay{
        padding:12px;
    }

    .category-overlay h3{
        font-size:11px;
    }

    .category-overlay p{
        font-size:7px;
    }


    .newsletter{
        padding:30px 15px;
    }

    .newsletter h2{
        font-size:18px;
    }

    .newsletter-form{
        flex-direction:column;
    }

    .newsletter-form button{
        width:100%;
    }


    .footer-main{
        grid-template
