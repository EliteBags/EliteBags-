<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bags Collection | Elite Bags</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#fafafa;
color:#111;
font-family:Arial,sans-serif;
}

.head{
height:70px;
background:#fff;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
}

.nav{
width:92%;
max-width:1150px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font:700 21px Georgia;
letter-spacing:3px;
text-decoration:none;
color:#111;
}

.logo b{
color:#b00020;
}

.back{
font-size:12px;
color:#666;
text-decoration:none;
}

.wrap{
width:92%;
max-width:1150px;
margin:auto;
}

.hero{
padding:40px 0 20px;
}

.ey{
color:#b00020;
font-size:11px;
font-weight:bold;
letter-spacing:2px;
}

h1{
font:500 45px Georgia;
margin:10px 0;
}

.hero p{
color:#777;
}

.filters{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:25px 0;
}

.filter{
background:#fff;
border:1px solid #ddd;
padding:10px 14px;
font-size:10px;
cursor:pointer;
}

.filter.active,
.filter:hover{
background:#b00020;
color:#fff;
border-color:#b00020;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
padding-bottom:65px;
}

.card{
background:#fff;
border:1px solid #ddd;
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.photo{
height:370px;
position:relative;
overflow:hidden;
background:#eee;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.tag{
position:absolute;
top:10px;
left:10px;
background:#111;
color:#fff;
padding:6px 8px;
font-size:9px;
letter-spacing:1px;
z-index:2;
}

.info{
padding:16px;
}

.info h2{
font:500 21px Georgia;
margin:0 0 7px;
}

.meta{
font-size:12px;
color:#777;
}

.price{
font-size:18px;
font-weight:bold;
margin:10px 0 14px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.view,
.wa{
padding:12px 5px;
text-align:center;
font-size:10px;
font-weight:bold;
border:1px solid #ddd;
text-decoration:none;
display:block;
}

.view{
background:#fff;
color:#111;
}

.view:hover{
background:#111;
color:#fff;
}

.wa{
background:#b00020;
color:#fff;
border-color:#b00020;
}

.wa:hover{
background:#8d001a;
}

.foot{
background:#111;
color:#aaa;
text-align:center;
padding:25px;
font-size:11px;
}

@media(max-width:800px){

.grid{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.photo{
height:280px;
}

h1{
font-size:37px;
}

}

@media(max-width:500px){

.grid{
grid-template-columns:1fr 1fr;
gap:10px;
}

.photo{
height:225px;
}

.info{
padding:10px;
}

.info h2{
font-size:16px;
line-height:1.25;
}

.actions{
grid-template-columns:1fr;
}

.filter{
padding:9px 11px;
font-size:9px;
}

}

</style>
</head>


<body>


<header class="head">

<nav class="nav">

<a class="logo" href="index.html">
ELITE <b>BAGS</b>
</a>

<a class="back" href="index.html">
← MAIN PAGE
</a>

</nav>

</header>



<main class="wrap">


<section class="hero">

<span class="ey">
ELITE BAGS · COLLECTION
</span>

<h1>
Bags Collection
</h1>

<p>
Explore our selected sample bags collection.
More styles and products can be added here.
</p>


<div class="filters">

<button
class="filter active"
onclick="filterProducts('All',this)">
ALL
</button>

<button
class="filter"
onclick="filterProducts('Handbags',this)">
👜 HANDBAGS
</button>

<button
class="filter"
onclick="filterProducts('Shoulder Bags',this)">
SHOULDER BAGS
</button>

<button
class="filter"
onclick="filterProducts('Crossbody Bags',this)">
CROSSBODY
</button>

<button
class="filter"
onclick="filterProducts('Tote Bags',this)">
TOTE BAGS
</button>

<button
class="filter"
onclick="filterProducts('Mini Bags',this)">
MINI BAGS
</button>

<button
class="filter"
onclick="filterProducts('Evening Bags',this)">
EVENING
</button>

</div>

</section>



<section
class="grid"
id="grid">
</section>


</main>



<footer class="foot">

© 2026 Elite Bags · Free Worldwide Delivery · Pre-shipment video available

</footer>



<script>


const products = [


{
name:"Classic Structured Handbag",
sub:"Handbags",
price:"$249",
tag:"FEATURED",
color:"Black",
size:"Standard",
material:"Premium Leather",
desc:"Elegant structured handbag designed for polished everyday styling.",

images:[
"https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=1000&q=85",
"https://images.unsplash.com/photo-1594223274512-ad4803739b7c?auto=format&fit=crop&w=1000&q=85"
]
},


{
name:"Quilted Shoulder Bag",
sub:"Shoulder Bags",
price:"$269",
tag:"TRENDING",
color:"Black",
size:"Standard",
material:"Quilted Leather",
desc:"A refined quilted shoulder silhouette with elegant chain detail.",

images:[
"https://images.unsplash.com/photo-1594223274512-ad4803739b7c?auto=format&fit=crop&w=1000&q=85",
"https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=1000&q=85"
]
},


{
name:"Everyday Crossbody",
sub:"Crossbody Bags",
price:"$199",
tag:"NEW",
color:"Brown",
size:"Standard",
material:"Premium Canvas",
desc:"Compact crossbody design for effortless everyday use.",

images:[
"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=1000&q=85",
"https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=1000&q=85"
]
},


{
name:"Minimal Tote",
sub:"Tote Bags",
price:"$229",
tag:"POPULAR",
color:"Tan",
size:"Standard",
material:"Premium Leather",
desc:"Clean and spacious tote silhouette for modern daily styling.",

images:[
"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=1000&q=85",
"https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=1000&q=85"
]
},


{
name:"Mini Evening Bag",
sub:"Mini Bags",
price:"$189",
tag:"NEW",
color:"Black",
size:"Mini",
material:"Premium Leather",
desc:"Small statement bag made for elegant evening looks.",

images:[
"https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=1000&q=85",
"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=1000&q=85"
]
},


{
name:"Elegant Evening Clutch",
sub:"Evening Bags",
price:"$179",
tag:"FEATURED",
color:"Black",
size:"One Size",
material:"Satin / Leather",
desc:"Elegant evening clutch for formal events and sophisticated styling.",

images:[
"https://images.unsplash.com/photo-1594223274512-ad4803739b7c?auto=format&fit=crop&w=1000&q=85",
"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=1000&q=85"
]
}


];


let active = "All";



function productURL(p){

const q = new URLSearchParams({

name:p.name,

category:"Bags",

sub:p.sub,

price:p.price,

color:p.color,

size:p.size,

material:p.material,

quality:"MASTER QUALITY",

badge:p.tag,

description:p.desc

});


p.images.forEach((image,index)=>{

q.set(
"image"+(index+1),
image
);

});


return "product.html?" + q.toString();

}



function renderProducts(){

const list =
active === "All"
? products
: products.filter(
p => p.sub === active
);


document.getElementById("grid").innerHTML = list.map(p => `

<article class="card">

<div class="photo">

<span class="tag">
${p.tag}
</span>

<img
src="${p.images[0]}"
alt="${p.name}"
loading="lazy"
>

</div>


<div class="info">

<h2>
${p.name}
</h2>

<div class="meta">
${p.sub} · Premium fashion style
</div>

<div class="price">
${p.price}
</div>


<div class="actions">

<a
class="view"
href="${productURL(p)}">
VIEW PRODUCT
</a>


<a
class="wa"
target="_blank"
href="https://wa.me/12089034508?text=${encodeURIComponent(
"Hello Elite Bags! I am interested in " +
p.name +
" (" +
p.price +
"). Please share details."
)}">
WHATSAPP
</a>

</div>

</div>

</article>

`).join("");

}



function filterProducts(category,button){

active = category;


document
.querySelectorAll(".filter")
.forEach(btn => {

btn.classList.remove("active");

});


button.classList.add("active");


renderProducts();

}



renderProducts();


</script>


</body>
</html>
